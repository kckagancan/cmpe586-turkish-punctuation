[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cmpe586-turkish-punctuation"
version = "0.1.0"
description = "Robustness of Turkish Punctuation Restoration under Informal Writing Noise"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.6,<3",
    "transformers>=4.45,<5",
    "datasets>=3,<5",
    "accelerate>=1,<2",
    "scikit-learn>=1.5,<2",
    "pandas>=2.2,<3",
    "matplotlib>=3.9,<4",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6,<8",
    "jupyterlab>=4,<5",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
