name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Check public files, notebooks, links and report bindings
        run: python scripts/check_repository.py
      - name: Install lightweight linter
        run: python -m pip install 'ruff==0.17.1'
      - name: Check syntax and undefined names without running experiments
        run: python -m ruff check --select E9,F scripts src tests
